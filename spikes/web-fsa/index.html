<!doctype html>
<meta charset="utf-8">
<title>web-fsa spike</title>
<script type="module">
  import init, { run_spike, count_files, seed } from './beatseam_spike_web_fsa.js';

  const idb = () => new Promise((resolve, reject) => {
    const r = indexedDB.open('spike', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  const tx = async (mode, f) => {
    const db = await idb();
    return new Promise((resolve, reject) => {
      const t = db.transaction('handles', mode);
      const req = f(t.objectStore('handles'));
      t.oncomplete = () => resolve(req.result);
      t.onerror = () => reject(t.error);
    });
  };

  window.runSpike = async () => run_spike(await navigator.storage.getDirectory());
  window.seedAndStore = async (n) => {
    const root = await navigator.storage.getDirectory();
    const dir = await root.getDirectoryHandle('persist', { create: true });
    await seed(dir, n);
    await tx('readwrite', (s) => s.put(dir, 'root'));
    return n;
  };
  window.restoreAndCount = async () => {
    const dir = await tx('readonly', (s) => s.get('root'));
    const perm = await dir.queryPermission({ mode: 'read' });
    return `restored handle "${dir.name}" (${dir.kind}), queryPermission=${perm}, Rust count_files=${await count_files(dir)}`;
  };

  await init();
  window.ready = true;
</script>
