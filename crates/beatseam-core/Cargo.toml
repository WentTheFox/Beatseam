[package]
name = "beatseam-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "Platform-independent Beatseam logic: no UI toolkit, no platform crates, no async runtime."

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await-macro"] }
serde_json = "1"


[features]
# Exposes the deterministic single-threaded test executor to other crates' tests.
test-support = []
