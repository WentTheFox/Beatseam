[package]
name = "beatseam-app"
version = "0.0.0"
edition = "2024"
publish = false
description = "The app layer: state slices and the actions that drive them, shared by every UI."

[dependencies]
beatseam-core = { path = "../beatseam-core" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
beatseam-server-mode = { path = "../beatseam-server-mode" }
beatseam-core = { path = "../beatseam-core", features = ["test-support"] }
