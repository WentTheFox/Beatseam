[package]
name = "beatseam-native"
version = "0.0.0"
edition = "2024"
publish = false
description = "Desktop and Android services for beatseam-core: file access over std::fs and a SQLite library store."

[dependencies]
beatseam-core = { path = "../beatseam-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
beatseam-core = { path = "../beatseam-core", features = ["test-support"] }
